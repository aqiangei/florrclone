Host florr-coordinator
    HostName 154.219.105.161
    Port 22
    User florr-shard-link
    IdentityFile /etc/florrclone/shard-coordinator.key

Host *
    BatchMode yes
    IdentitiesOnly yes
    StrictHostKeyChecking yes
    UserKnownHostsFile /etc/florrclone/shard-known-hosts
    ForwardAgent no
    RequestTTY no
    ConnectTimeout 10
    ServerAliveInterval 15
    ServerAliveCountMax 3
    LogLevel ERROR
