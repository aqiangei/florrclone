map $http_upgrade $florrclone_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 8088 default_server;
    listen [::]:8088 default_server;
    server_name _;
    include /etc/nginx/florr-game-entry.d/*.conf;
    include /etc/nginx/ashflor-council/*.conf;
    client_max_body_size 8k;
    gzip on;
    gzip_comp_level 2;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;
    error_page 502 503 504 =503 /__maintenance.html;
    location = /__maintenance.html {
        internal;
        alias /var/www/florrclone-maintenance/maintenance.html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
    }
    location = /__release_ready {
        if (-f /var/www/florrclone-maintenance/enabled) { return 503; }
        proxy_pass http://127.0.0.1:8788/api/health;
        add_header Cache-Control "no-store" always;
    }
    location ~ (^|/)\. { return 404; }
    location ~ ^/(server([.]|/|$)|data(/|$)|node_modules(/|$)|deploy|shard[-_]|release-check[.]|florr.*[.]service|nginx-game[.]conf|test-results(/|$)|inventory[.]json) { return 404; }
    location / {
        if (-f /var/www/florrclone-maintenance/enabled) { return 503; }
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $florrclone_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        tcp_nodelay on;
    }
}
