<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>游戏更新中</title>
<style>body{margin:0;background:#179c60;color:white;font:18px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(520px,calc(100% - 48px));margin:20px 0;padding:18px;background:#163b32;border-radius:18px;text-align:center;box-shadow:0 10px 35px #0004;box-sizing:border-box}h1{font-size:26px;margin:10px}p{line-height:1.6;color:#d5eee3;font-size:15px}small{color:#afe0c9}canvas{display:block;width:100%;background:#21865c;border-radius:12px;touch-action:none}button{font:inherit;background:#ffe36e;border:0;padding:10px 24px;border-radius:8px;cursor:pointer;margin:8px}#enter{background:#72f2a2}#score{margin:10px}</style>
<main><h1>游戏正在更新</h1><p>维护期间，来玩一局花朵躲石头吧！<br>方向键移动，或在下方拖动花朵。碰到石头后可重新开始。</p><div id="score" aria-live="polite">得分：0</div><canvas id="game" width="440" height="320" aria-label="花朵躲石头小游戏"></canvas><button id="restart">重新开始</button><div><small id="status" role="status">正在等待服务器恢复…</small></div><button id="enter" hidden>更新完成，进入游戏</button><p>小游戏成绩仅保存在当前页面。</p></main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score');
let player,rocks,score,over,last=0,spawn=0;const keys=new Set();
function reset(){player={x:220,y:275};rocks=[];score=0;over=false;spawn=0;scoreEl.textContent='得分：0';}reset();
document.getElementById('restart').onclick=reset;
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();keys.add(e.key);}});addEventListener('keyup',e=>keys.delete(e.key));addEventListener('blur',()=>keys.clear());
function point(e){const r=canvas.getBoundingClientRect();player.x=Math.max(15,Math.min(425,(e.clientX-r.left)*440/r.width));player.y=Math.max(15,Math.min(305,(e.clientY-r.top)*320/r.height));}
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);point(e);};canvas.onpointermove=e=>{if(canvas.hasPointerCapture(e.pointerId))point(e);};
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
function frame(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;if(!over){score+=dt*10;spawn+=dt;if(spawn>.55){spawn=0;rocks.push({x:16+Math.random()*408,y:-18,r:9+Math.random()*10,v:70+Math.min(100,score/5)});}player.x=Math.max(15,Math.min(425,player.x+((keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0))*240*dt));player.y=Math.max(15,Math.min(305,player.y+((keys.has('ArrowDown')?1:0)-(keys.has('ArrowUp')?1:0))*240*dt));for(const r of rocks){r.y+=r.v*dt;if(Math.hypot(r.x-player.x,r.y-player.y)<r.r+11)over=true;}rocks=rocks.filter(r=>r.y<345);scoreEl.textContent='得分：'+Math.floor(score);}
ctx.clearRect(0,0,440,320);for(const r of rocks)circle(r.x,r.y,r.r,'#7f9391');for(let i=0;i<6;i++)circle(player.x+Math.cos(i*Math.PI/3)*10,player.y+Math.sin(i*Math.PI/3)*10,7,'#fff5bc');circle(player.x,player.y,11,'#ffe14e');circle(player.x-4,player.y-2,1.5,'#263d32');circle(player.x+4,player.y-2,1.5,'#263d32');if(over){ctx.fillStyle='#123b32cc';ctx.fillRect(0,125,440,65);ctx.fillStyle='white';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText('碰到石头啦，再来一局！',220,165);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
let checking=false;setInterval(async()=>{if(checking)return;checking=true;try{const r=await fetch('/__release_ready?t='+Date.now(),{cache:'no-store'});if(r.ok){const h=await r.json();if(h.ok){document.getElementById('status').textContent='更新完成，可以返回游戏了！';document.getElementById('enter').hidden=false;}}}catch{}finally{checking=false;}},5000);document.getElementById('enter').onclick=()=>location.reload();
</script></html>
