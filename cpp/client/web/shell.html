// MOBILE_FULLSCREEN_BEGIN
(function(){
  const btn=document.getElementById('landscape-btn'),hint=document.getElementById('landscape-hint');
  const mobile=/iPhone|iPad|iPod|Android|BlackBerry/i.test(navigator.userAgent)||
    (navigator.maxTouchPoints>1&&matchMedia('(pointer: coarse)').matches);
  // A standalone mobile app or WebView may silently block new tabs.
  // Keep the same-origin link in the current view on touch/mobile browsers.
  if(mobile || navigator.standalone || matchMedia('(display-mode: standalone), (pointer: coarse)').matches ||
     new URLSearchParams(location.search).has('mobile')){
    const council=document.getElementById('council-link');
    council.target='_self';
  }
  let clicked=false,hideTimer;
  const active=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const landscape=()=>innerWidth>innerHeight;
  function message(text){hint.querySelector('span').textContent=text;hint.hidden=false;}
  hint.querySelector('button').onclick=()=>{hint.hidden=true;};
  async function enter(){
    const root=document.documentElement;
    const request=root.requestFullscreen||root.webkitRequestFullscreen||root.webkitRequestFullScreen;
    let allowed=active();
    try{if(!allowed&&request){await request.call(root);allowed=active();}}catch(e){}
    let locked=false;
    try{if(screen.orientation&&screen.orientation.lock){await screen.orientation.lock('landscape');locked=true;}}catch(e){}
    if(!allowed){message('当前浏览器未允许网页全屏。iPhone / iPad 可用 Safari“分享 → 添加到主屏幕”后打开游戏；请将设备横过来游玩。');}
    else if(!locked&&!landscape()){message('已进入全屏，请将设备横过来。当前浏览器不支持自动锁定横屏。');}
    else hint.hidden=true;
    return allowed;
  }
  window.florrToggleFullscreen=async function(){
    if(!active())return enter();
    const exit=document.exitFullscreen||document.webkitExitFullscreen;
    try{if(exit)await exit.call(document);if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}
    catch(e){message('退出全屏失败，请使用浏览器的退出全屏按钮。');}
  };
  btn.onclick=async function(){
    if(btn.disabled)return;
    clicked=true;clearTimeout(hideTimer);btn.disabled=true;
    try{btn.hidden=await enter()||landscape();}
    finally{btn.disabled=false;}
  };
  window.florrMobileReady=function(){
    if(mobile&&!clicked){btn.hidden=false;clearTimeout(hideTimer);hideTimer=setTimeout(()=>{btn.hidden=true;},10000);}
  };
  // Keep the shortcut visible while loading, then for ten seconds in the game.
  if(mobile)btn.hidden=false;
  addEventListener('resize',()=>{if(landscape())hint.hidden=true;});
})();
// MOBILE_FULLSCREEN_END

    <script>
(function () {
  const query = new URLSearchParams(location.search);
  const status = document.getElementById('loadingScreen');
  const canvas = document.getElementById('canvas');
  const stage = document.getElementById('loading-stage');
  const detail = document.getElementById('loading-detail');
  const progress = document.getElementById('loading-progress');
  const meta = document.getElementById('loading-meta');
  const retry = document.getElementById('loading-retry');
  const quality = document.getElementById('loading-quality');
  const lowGraphics = query.get('quality') === 'low';
  window.flixLowMemoryGraphics = lowGraphics;
  status.toggleAttribute('data-static', lowGraphics);
  quality.textContent = lowGraphics ? '切回标准画质' : '内存不足？使用低清模式';
  const qualityUrl = new URL(location.href);
  if (lowGraphics) qualityUrl.searchParams.set('quality', 'standard');
  else qualityUrl.searchParams.set('quality', 'low');
  quality.href = qualityUrl.href;
  const serverNotice = document.getElementById('serverNotice');
  let noticeDismissed = true;
  document.getElementById('closeServerNotice').onclick=()=>{noticeDismissed=true;serverNotice.hidden=true;};
  const began = performance.now();
  let failed = false, bytes = 0, total = 0, lastProgress = performance.now();
  const ui = window.flixLoading = {
    phase(title, message) { if(failed)return; status.hidden=false;stage.textContent=title;detail.textContent=message; },
    download(received, expected) {
      if(failed)return; bytes=received;total=expected;lastProgress=performance.now();
      stage.textContent='正在下载游戏资源';
      detail.textContent='资源下载后会自动启动，请保持页面打开。';
      if(total>0){progress.max=total;progress.value=bytes;}else progress.removeAttribute('value');
    },
    error(message) {
      failed=true;status.hidden=false;stage.textContent='暂时未能进入游戏';detail.textContent=message;
      status.setAttribute('data-static', '');
      progress.hidden=true;retry.hidden=false;meta.textContent='你的账号和存档不会因此丢失。';
    },
    finish() { if(!failed){status.hidden=true;serverNotice.hidden=noticeDismissed;window.florrMobileReady();} }
  };
  retry.onclick=()=>location.reload();
  const timer=setInterval(()=>{
    if(failed||status.hidden)return;
    const seconds=Math.floor((performance.now()-began)/1000);
    const size=bytes ? (bytes/1048576).toFixed(1)+' MB'+(total?' / '+(total/1048576).toFixed(1)+' MB':'')+' · ' : '';
    meta.textContent=size+'已等待 '+seconds+' 秒';
    if(bytes && performance.now()-lastProgress>10000 && stage.textContent==='正在下载游戏资源')
      detail.textContent='网络传输较慢，正在继续下载；超过等待时间会提供重试。';
  },500);


  const host = query.get('host') || location.hostname || '127.0.0.1';
  // A page URL with no explicit port was served on its scheme's default,
  // and that is the port the game dials too. Whatever fronts the server --
  // nginx, Cloudflare's proxy -- answers there and forwards to the server's
  // own 3000, which is not reachable through it (Cloudflare will not carry
  // that port at all). The 3000 fallback is for a page with no origin port
  // to go by, such as one opened from disk.
  const defaultPort = location.protocol === 'https:' ? '443'
                    : location.protocol === 'http:' ? '80' : '3000';
  const port = query.get('port') || location.port || defaultPort;

  const args = ['--data', 'data', '--host', host, '--port', port];
  // Credentials only from the URL (?user=&password=) for scripted captures.
  // Ordinary players get guest / login UI with nothing prefilled.
  const user = query.get('user');
  const password = query.get('password');
  if (user !== null) args.push('--user', user);
  if (password !== null) args.push('--password', password);
  if (query.get('lobby') !== null) args.push('--lobby');
  if (query.get('stats') !== null) args.push('--stats');
  if (lowGraphics) args.push('--low-memory');
  // Forces the touch controls up on a desktop browser, which reports a mouse
  // and would otherwise never show them. For looking at them, not for playing.
  if (query.get('mobile') !== null) args.push('--mobile');
  for (const line of query.getAll('chat')) args.push('--chat', line);

  // What the game is created with (createFlowrix, below). It is the page's
  // global Module too, unless a boot script runs: see the boot section.
  var Module = {
    canvas,
    arguments: args,
    print: (text) => console.log(text),
    printErr: (text) => console.warn(text),
    setStatus: (text) => {
      if (!text) {
        ui.finish();
        canvas.focus();
        return;
      }
      ui.phase('正在启动游戏', '资源已就绪，正在准备画面和本地设置。');
    },
    onAbort: (what) => {
      ui.error('游戏启动失败，请点击重新连接；若仍失败，请反馈给管理员。');
    },
  };
  window.Module = Module;
})();
</script>
    <script>
(function () {
  // The game is linked -sMODULARIZE: its glue defines createFlowrix and
  // nothing else, and the module is the object handed to that -- this one --
  // rather than whatever the page's global Module happens to be. Which is what
  // lets a boot script be an emscripten program of its own, with a Module of
  // its own (see the boot section).
  const game = window.Module;
  const status = document.getElementById('loadingScreen');
  const canvas = document.getElementById('canvas');
  // Taken now: callMain needs them below, and the glue may not leave
  // game.arguments readable once it has consumed it.
  const gameArguments = game.arguments.slice();
  // The page's own downloads, which never go through the boot script's fetch
  // (the boot section below).
  const networkFetch = window.fetch.bind(window);

  // Runs `run` once the document has been parsed. Nothing starts before
  // then -- not the game, not a boot script: this runs while the parser is
  // still in the body, and the game reaches for the page's elements as soon
  // as main() does (the canvas, #loadingScreen, document.body for the ones it
  // makes), so a start that raced the parser worked or not by timing.
  const whenParsed = (run) => {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', run, { once: true });
    } else {
      run();
    }
  };

  // Set when a boot script runs in place of the game (the boot section below).
  // The runtime may then load before the game is wanted -- the script read one
  // of the game's files -- and that load stays off the screen: no loading
  // text, no decompression message, no error over the script's own page.
  let booting = false;
  let gameStarted = false;
  const quiet = () => booting && !gameStarted;
  const showStatus = game.setStatus;
  game.setStatus = (text) => { if (!quiet()) showStatus(text); };

  // What the page downloads is bundle.js -- emscripten's runtime glue -- and
  // bundle.wasm, the client itself with mobs.json, petals.json,
  // mob_drops.json, the maps and the font's metrics embedded inside it: about
  // five megabytes of it. The font itself is not in there: the page gets it
  // from the Google Fonts stylesheet in the head. `npm run build` stages a
  // raw-deflate copy of each beside the original, bundle.js.bin and
  // bundle.wasm.bin, and this prefers them.
  // Deflate takes the wasm to about a fifth, and on a first visit that
  // transfer is most of the wait.
  //
  // This is the browser client's compression scheme, carried over: the
  // TypeScript page deflated its bundle.js into bundle.bin at build time and
  // inflated it here with DecompressionStream, for the same reason and with
  // no library either side. What is new is that the wasm goes through it too,
  // since it is now where all the bytes are.
  //
  // The uncompressed files still ship, and nothing depends on the compressed
  // pair being there: a build served straight out of cpp/build-web has none
  // (compressing is a staging step -- an incremental relink should not spend
  // a second deflating five megabytes), and DecompressionStream is missing
  // from browsers older than 2023. Either way this falls through to the plain
  // file.
  let canInflate=false;
  try { new DecompressionStream('deflate-raw');canInflate=true; } catch (_) {}
  const fetchOptions={cache:'no-cache'};
  const ui=window.flixLoading;
  let downloadTicket='',downloadBase='',queueHeartbeat=null,compileWatchdog=null;
  let admission=null;
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const completedDownloads=new Set();
  const queueCall=async(path,method='GET')=>{
    for(let attempt=0;;++attempt){
      try {
        const response=await networkFetch('/download-queue/'+path,{method,cache:'no-store',signal:AbortSignal.timeout(10000)});
        if(response.ok)return await response.json();
        if(response.status===410)return null;
        throw Error('HTTP '+response.status);
      } catch(error) {
        if(attempt>=3)throw error;
        await wait(1000*(attempt+1)+Math.random()*500);
      }
    }
  };
  const releaseDownload=()=>{
    clearInterval(queueHeartbeat);queueHeartbeat=null;
    if(downloadTicket){const ticket=downloadTicket;downloadTicket='';
      networkFetch('/download-queue/release?ticket='+encodeURIComponent(ticket),{method:'POST',keepalive:true}).catch(()=>{});
    }
  };
  window.addEventListener('pagehide',event=>{if(!event.persisted)releaseDownload();});
  const enterDownloadQueue=()=>{
    if(['localhost','127.0.0.1',''].includes(location.hostname))return Promise.resolve();
    if(admission)return admission;
    admission=(async()=>{
      ui.phase('正在加入下载队列','按进入顺序下载资源，请保持页面打开。');
      let row=null;
      while(row?.state!=='ready'){
        if(!row){
          const request=Array.from(crypto.getRandomValues(new Uint8Array(24)),
            value=>value.toString(16).padStart(2,'0')).join('');
          row=await queueCall('join?request='+request,'POST');
          if(!row?.ticket)throw Error('下载队列没有返回票据');
          downloadTicket=row.ticket;
        }
        if(row.state==='ready')break;
        ui.phase('正在排队下载','前方还有 '+row.ahead+' 人排队，当前 '+row.active+' 人正在下载；轮到后会自动开始。');
        await wait(2000);
        row=await queueCall('status?ticket='+encodeURIComponent(downloadTicket));
      }
      downloadBase=row.assetBase;
      clearInterval(queueHeartbeat);
      queueHeartbeat=setInterval(()=>queueCall('status?ticket='+encodeURIComponent(downloadTicket)).catch(()=>{}),5000);
      ui.phase('正在下载游戏资源','已轮到你，资源下载完成后会自动进入。');
    })().finally(()=>{admission=null;});
    return admission;
  };
  const resourceUrl=name=>downloadBase?downloadBase+name:name;
  const downloadCompleted=name=>{
    completedDownloads.add(name);
    if(completedDownloads.size===2){releaseDownload();compileWatchdog=setTimeout(()=>fail('资源编译启动超时'),90000);}
  };
  const streamLowMemory = gameArguments.includes('--low-memory') &&
    typeof WebAssembly.compileStreaming === 'function';
  // Count compressed transfer bytes, rather than calling the entire wait
  // "decompressing". An idle transfer is aborted; retry once, then offer an
  // explicit reconnect instead of leaving the player on an endless spinner.
  const load=async(name,contentType,consumeStream)=>{
    for(let attempt=0;attempt<2;attempt++){
      const controller=new AbortController();let timer;
      const arm=()=>{clearTimeout(timer);timer=setTimeout(()=>controller.abort(),25000);};
      try {
        arm();
        const ticket=downloadTicket;
        const options={...fetchOptions,cache:downloadBase?'force-cache':'no-cache',signal:controller.signal,headers:ticket?{'X-Download-Ticket':ticket}:{}};
        let packed=canInflate;
        let response=await networkFetch(resourceUrl(name+(packed?'.bin':'')),options);
        if(packed&&(response.status===404||response.status===410)){
          packed=false;response=await networkFetch(resourceUrl(name),options);
        }
        if(response.status===403&&ticket&&!attempt){
          clearTimeout(timer);
          if(ticket===downloadTicket){
            const row=await queueCall('status?ticket='+encodeURIComponent(ticket));
            if(!row&&ticket===downloadTicket){releaseDownload();await enterDownloadQueue();}
          }
          if(admission)await admission;
          continue;
        }
        if(!response.ok)throw Error('HTTP '+response.status);
        const expected=Number(response.headers.get('content-length'))||0;
        const reader=response.body.getReader();let received=0;
        const stream=new ReadableStream({
          async pull(out){
            try {
              const next=await reader.read();
              if(next.done){
                clearTimeout(timer);downloadCompleted(name);
                if(consumeStream&&!quiet())ui.phase('正在启动游戏引擎','资源已到齐，正在完成编译。');
                out.close();return;
              }
              arm();received+=next.value.byteLength;
              if(name==='bundle.wasm'&&!quiet())ui.download(received,expected);
              out.enqueue(next.value);
            } catch(error){clearTimeout(timer);out.error(error);}
          },
          cancel(reason){clearTimeout(timer);controller.abort();return reader.cancel(reason);}
        });
        if(consumeStream){
          const body=packed?stream.pipeThrough(new DecompressionStream('deflate-raw')):stream;
          return await consumeStream(new Response(body,{headers:{'Content-Type':contentType}}));
        }
        // Buffer the SMALL compressed artifact once. A failed transfer can be
        // retried here, never silently downloading the 29 MB plain wasm twice.
        const bytes=await new Response(stream).arrayBuffer();
        clearTimeout(timer);
        if(name==='bundle.wasm'&&!quiet())ui.phase(packed?'正在解压游戏资源':'正在准备游戏资源','下载完成，正在处理本地资源。');
        let body=new Blob([bytes]).stream();
        if(packed)body=body.pipeThrough(new DecompressionStream('deflate-raw'));
        return new Response(body,{headers:{'Content-Type':contentType}});
      } catch(error){
        clearTimeout(timer);
        controller.abort();
        if(attempt)throw error;
        if(!quiet())ui.phase('正在重新连接资源','刚才的传输未完成，正在自动重试一次。');
      }
    }
  };

  let loadError = '';
  let runtimeFailed = null;
  const fail = (what) => {
    releaseDownload();clearTimeout(compileWatchdog);
    console.error('[loader] ' + what);
    if (!loadError) loadError = what;
    if (runtimeFailed) runtimeFailed(new Error(what));
    if (quiet()) return;
    const message = what.startsWith('下载队列')
      ? '暂时连不上下载队列。已自动重试，请稍后点「重新连接」。'
      : completedDownloads.size===2
        ? '资源已下载，但游戏引擎启动失败。请点「重新连接」，也可尝试低清模式。'
        : '资源下载中断。已自动重试，请点「重新连接」。';
    ui.error(message);
  };

  // Everything from here to the boot section below is the game's own load. It
  // is a function rather than straight-line code because a boot script may run
  // in its place (see below), and that script decides when -- and whether --
  // the runtime loads and the game starts. Called once; later calls return
  // the same promise, which settles when the runtime is up (and, without a
  // boot script, main() has been called).
  let runtime = null;
  let runtimeReady = false;
  const loadRuntime = () => {
    if (runtime) return runtime;
    runtime = new Promise((resolve, reject) => {
      game.onRuntimeInitialized = () => {
        runtimeReady = true;
        resolve();
      };
      runtimeFailed = reject;
    });
    // Nobody may be waiting on it, when the game was going to start anyway;
    // fail() has already said why.
    runtime.catch(() => {});
    (async()=>{
    await enterDownloadQueue();

    // Started now, before the glue: compiling the module is the long pole, and
    // this way it runs against the download instead of after it.
    // compileStreaming over a Response the page built itself is specified to
    // work -- the MIME type above is what it checks -- and the retry is for an
    // engine that disagrees. A module that simply does not compile fails the
    // retry too, with the same message.
    const compiled = streamLowMemory
      ? load('bundle.wasm','application/wasm',response=>WebAssembly.compileStreaming(response))
      : load('bundle.wasm', 'application/wasm')
      .then(async response=>{
        if(!quiet())ui.phase('正在启动游戏引擎','正在解压并编译资源，手机首次启动可能需要稍等。');
        // Use the already downloaded bytes if streaming compilation is not
        // supported. Do not issue a second complete download on any error.
        return typeof WebAssembly.compileStreaming==='function'
          ? WebAssembly.compileStreaming(response)
          : WebAssembly.compile(await response.arrayBuffer());
      });
    runtime.then(()=>clearTimeout(compileWatchdog),()=>clearTimeout(compileWatchdog));
    compiled.catch(error=>fail('bundle.wasm: '+error));

    // The glue asks for the module through this hook rather than going looking
    // for bundle.wasm, which is what keeps it off the uncompressed copy.
    // Returning an empty object is emscripten's "not yet": the instance arrives
    // through the callback whenever the compile above finishes.
    game.instantiateWasm = (imports, ready) => {
      compiled.then((module) => WebAssembly.instantiate(module, imports))
              .then(ready)
              .catch((error) => fail('bundle.wasm: ' + error));
      return {};
    };

    // The glue itself, injected rather than left to the <script src> tag emcc
    // emits (parked in the comment at the end of this file), because the copy
    // worth loading is the compressed one. An injected script runs in global
    // scope exactly as that tag's would, and synchronously: createFlowrix is
    // defined the moment appendChild returns.
    load('bundle.js', 'text/javascript')
      .then((response) => response.text())
      .then(async (source) => {
        await Promise.race([document.fonts.load("700 16px Ubuntu").catch(()=>{}),
                            new Promise(resolve=>setTimeout(resolve,2000))]);
        const script = document.createElement('script');
        script.textContent = source;
        document.body.appendChild(script);
        // Settles when the runtime is up; a failure has gone through
        // onAbort, which said so on screen.
        createFlowrix(game).catch(error=>fail('游戏启动失败：'+error));
      })
      .catch((error) => fail('bundle.js: ' + error));
    })().catch(error=>fail('下载队列：'+error));
    return runtime;
  };

  // Without a boot script the glue calls main() itself once the runtime is
  // up. With one it was told not to (noInitialRun), and this calls it.
  let mainCalled = false;
  const startGame = () => {
    if (gameStarted) return;
    gameStarted = true;
    if (loadError) {
      fail(loadError);
      return;
    }
    // A runtime the script already had loaded put nothing on screen to take
    // down; one still loading shows its progress from here on.
    if (!runtimeReady) status.hidden = false;
    const started = loadRuntime();
    if (!booting) return;
    started.then(async () => {
      await document.fonts.load("700 16px Ubuntu");
      game.callMain(gameArguments);
      mainCalled = true;
      canvas.focus();
    }, () => {});
  };

  // --- the boot script ------------------------------------------------------
  // Debug > Assets > Boot can name a script for the next load to run INSTEAD
  // of the game: one of the tools embedded in the wasm under /boot, or any .js
  // file the player had open (client/web/boot.h). The client keeps it beside
  // its settings in browser storage, base64 like the rest of what that mount
  // stores, so it is read here before a byte of the game is fetched: a tool
  // that never starts the game costs nothing, and one that does sets itself up
  // first and then calls Module.flixBoot.startGame().
  //
  // `?boot=game` skips the script for this load and `?boot=reset` forgets it.
  // Both are read here, needing nothing from the client, so no script -- a
  // broken one, or one somebody was talked into keeping -- can lock anyone
  // out of the game.
  const kBootPrefix = 'flowrix/';
  // The bytes the mount keeps under `name`, or null when there are none.
  const storedBytes = (name) => {
    try {
      const saved = localStorage.getItem(kBootPrefix + name);
      if (saved === null) return null;
      return Uint8Array.from(atob(saved), (c) => c.charCodeAt(0));
    } catch (e) {
      return null;
    }
  };
  const stored = (name) => {
    const bytes = storedBytes(name);
    return bytes ? new TextDecoder().decode(bytes) : '';
  };
  const forget = () => {
    try {
      localStorage.removeItem(kBootPrefix + 'boot-script');
      localStorage.removeItem(kBootPrefix + 'boot-path');
    } catch (e) { }
  };
  const bootMode = new URLSearchParams(location.search).get('boot');
  if (bootMode === 'reset') forget();
  const bootSource = bootMode === 'game' || bootMode === 'reset' ? '' : stored('boot-script');
  const bootPath = bootSource ? (stored('boot-path') || 'boot-script.js') : '';
  const flixBoot = {
    // What this load runs instead of the game, by the path it was set from.
    // Empty when the game starts directly; the client reads it to say so.
    path: bootPath,
    // What the client's files in browser storage are kept under.
    prefix: kBootPrefix,
    startGame,
    // Forgets the boot script, so the next load starts the game.
    clear: forget,
    // The game's module, for poking at from a script; and the arguments
    // main() is (or will be) given.
    game,
    arguments: gameArguments,
  };
  // The client reads this one (client/web/boot.cpp).
  game.flixBoot = flixBoot;
  if (!bootSource) {
    whenParsed(startGame);
    return;
  }

  // A script that throws on its way in leaves a way out on screen.
  const bootFailed = (error) => {
    console.error('[boot] ' + bootPath + ' failed: ' + error);
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;gap:16px;padding:24px;background:#16191c;' +
      'color:#fff;font:700 16px Ubuntu,sans-serif;text-align:center';
    const message = document.createElement('div');
    message.textContent = 'The boot script ' + bootPath + ' failed: ' + error;
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center';
    const action = (label, run) => {
      const button = document.createElement('button');
      button.textContent = label;
      button.style.cssText = 'font:inherit;padding:8px 16px;border:0;border-radius:4px;' +
        'background:#4caf50;color:#fff;cursor:pointer';
      button.onclick = run;
      row.append(button);
    };
    action('Start the game', () => { box.remove(); startGame(); });
    action('Forget the script and reload', () => { forget(); location.reload(); });
    box.append(message, row);
    document.body.append(box);
  };

  // The page's global Module, from here on, is the script's and not the
  // game's: a fresh one. A script that is an emscripten program takes it as
  // its own -- its glue starts `var Module = typeof Module != 'undefined' ?
  // Module : {}` -- and would otherwise have picked up the game's arguments,
  // its noInitialRun, its instantiateWasm and the rest. The game never reads
  // the global (createFlowrix, above).
  //
  // What it does carry is what a page normally hands an emscripten program:
  // the page's canvas, which SDL, GLFW and the GL context creation all find
  // through Module.canvas, and the same print/printErr as the game's. The
  // canvas is the game's one too. That is no trouble for a script that
  // starts the game or never draws, but one that takes a WebGL context on it
  // leaves the game no 2D context, so such a script should not also start
  // the game.
  window.Module = { flixBoot, canvas: game.canvas, print: game.print, printErr: game.printErr };

@FLIX_BOOT_FILES_JS@
  installBootFiles({
    path: bootPath,
    stored: storedBytes,
    runtime: loadRuntime,
    ready: () => runtimeReady,
    files: () => game.FS,
    mainCalled: () => mainCalled,
  });
  booting = true;
  game.noInitialRun = true;

  console.info('[boot] running ' + bootPath + ' instead of the game; ' +
               '?boot=game skips it once, ?boot=reset forgets it');
  status.hidden = true;
  whenParsed(() => {
    try {
      // window.eval, which is an indirect eval: the script runs in global
      // scope, as a <script> element's would, but a throw on the way in lands
      // here instead of nowhere. The sourceURL names it in the developer
      // tools.
      window.eval(bootSource + '\n//# sourceURL=' + bootPath.replace(/^\/+/, ''));
    } catch (error) {
      bootFailed(error);
    }
  });
})();
</script>
    <!-- emcc replaces the token below with a <script> tag for bundle.js, and
         refuses a shell that does not carry it. The loader above is what
         loads the glue here, from bundle.js.bin when there is one, so the tag
         is parked inside this comment: inert in the dev build, which keeps
         comments, and gone from the release build, which strips them.
         {{{ SCRIPT }}} -->
</body>
</html>
